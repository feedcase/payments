[alembic]
script_location = src/modules/payments/infrastructure/db/migrations
prepend_sys_path = src
version_table = alembic_version_payments

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
